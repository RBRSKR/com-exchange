name: 시세 갱신

on:
  schedule:
    # 장중(09:00~22:00 KST = 00:00~13:00 UTC) 5분마다 실행. 10분 갱신이 GitHub 지연으로 늦어도 다음 실행에서 따라잡는다.
    - cron: '*/5 0-13 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 가격 엔진 테스트
        run: node --test engine.test.js
      - name: 시세 계산
        run: node scripts/build-data.js
        env:
          MARKET_SEED: ${{ secrets.MARKET_SEED }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
