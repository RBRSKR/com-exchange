name: 시세 갱신

# (백업) 실시간 시세는 Cloudflare Worker가 계산한다. 이 작업은 Worker가 멈췄을 때 쓸 data.json을
# 한 번 실행되면 약 1시간 반 동안 15분마다 갱신하고,
# 장(09:00~22:00 KST)이 아직 열려 있으면 스스로 다음 실행을 시작한다.
# GitHub 예약 실행은 자주 늦거나 빠지므로, 아침 시작과 중간 끊김 대비용으로만 쓴다.
on:
  schedule:
    - cron: '50 23 * * *'        # 08:50 KST 시작
    - cron: '15 0-12 * * *'      # 끊겼을 때 다시 잇기
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 가격 엔진 테스트
        run: node --test engine.test.js
  t1:
    needs: test
    uses: ./.github/workflows/tick.yml
    with: { wait: false, tag: t1 }
    secrets: inherit
  t2:
    needs: t1
    uses: ./.github/workflows/tick.yml
    with: { tag: t2 }
    secrets: inherit
  t3:
    needs: t2
    uses: ./.github/workflows/tick.yml
    with: { tag: t3 }
    secrets: inherit
  t4:
    needs: t3
    uses: ./.github/workflows/tick.yml
    with: { tag: t4 }
    secrets: inherit
  t5:
    needs: t4
    uses: ./.github/workflows/tick.yml
    with: { tag: t5 }
    secrets: inherit
  t6:
    needs: t5
    uses: ./.github/workflows/tick.yml
    with: { tag: t6 }
    secrets: inherit
  again:
    needs: t6
    runs-on: ubuntu-latest
    steps:
      - name: 장이 열려 있으면 다음 실행 시작
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(TZ=Asia/Seoul date +%H); M=$(TZ=Asia/Seoul date +%M)
          if [ "$H" -ge 8 ] && { [ "$H" -lt 22 ] || { [ "$H" -eq 22 ] && [ "$M" -lt 5 ]; }; }; then
            gh api -X POST repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches -f ref=main
            echo "다음 실행 시작"
          else
            echo "장 마감 시간이라 멈춤"
          fi
