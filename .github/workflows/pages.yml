name: 시세 갱신

on:
  schedule:
    # 08:00 · 17:00 · 22:00 KST (= 23:00 · 08:00 · 13:00 UTC). 늦어질 때를 대비해 한 번 더 돌린다.
    - cron: '2 23,8,13 * * *'
    - cron: '25 23,8,13 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 가격 엔진 테스트
        run: node --test engine.test.js
      - name: 시세 계산
        run: node scripts/build-data.js
        env:
          MARKET_SEED: ${{ secrets.MARKET_SEED }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
