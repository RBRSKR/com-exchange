<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COM EXCHANGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Direction: carbon trading terminal — hairline grid, mono numerals, one amber accent.
   Type: IBM Plex Sans KR (text), IBM Plex Mono (all numbers). Scale 12/14/16/20/28/44. Spacing base 4: 8/12/16/24/32/48. */
:root{color-scheme:dark;--bg:#0b0c0e;--bg2:#111317;--line:#23262c;--line2:#33373f;--muted:#8d8a83;--dim:#5f5d58;--text:#ece9e2;--up:#ff5a5f;--down:#4d8eff;--flat:#8d8a83;--accent:#f0b23e;--ok:#5ccf8f;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 'IBM Plex Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px 48px}
/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:24px;height:56px;padding-bottom:0}
.logo{display:flex;align-items:baseline;gap:8px;font-weight:600;font-size:16px;letter-spacing:.02em;white-space:nowrap}
.logo b{color:var(--accent);font-family:var(--mono);font-weight:600}
.logo small{font:500 12px var(--mono);color:var(--dim)}
nav{display:flex;gap:0;align-self:stretch}
nav a{display:flex;align-items:center;padding:0 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
nav a.on{color:var(--text);border-bottom-color:var(--accent)}
nav a:hover{color:var(--text)}
.spacer{flex:1}
.clock{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:12px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--muted)}
.pill .dot{width:8px;height:8px;background:var(--ok)}
.pill.halt .dot{background:var(--up)}
.pill.wait .dot{background:var(--dim)}
/* ticker tape */
.tape{border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap}
.tape .in{display:inline-flex;gap:32px;padding:8px 24px;font-size:12px}
.tape b{font-weight:600;margin-right:8px;color:var(--muted)}
/* headings */
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:32px}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.04em}
h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:4px 0 0;font-weight:600}
h2{font-size:14px;margin:0;font-weight:600}
.sub{color:var(--muted);font-size:12px}
.notice{margin-top:24px;border-left:2px solid var(--accent);padding:8px 16px;font-size:14px;display:flex;gap:12px;background:var(--bg2)}
.notice .lab{color:var(--accent);font-weight:600;font-size:12px;padding-top:2px;white-space:nowrap}
.disclaim{margin-top:16px;color:var(--muted);font-size:12px;max-width:720px}
/* market strip + slot progress (signature) */
.strip{display:grid;grid-template-columns:repeat(5,auto);justify-content:start;gap:0;margin-top:24px;border-top:1px solid var(--line)}
.strip>div{padding:12px 32px 12px 0;margin-right:32px;border-right:1px solid var(--line)}
.strip>div:last-child{border-right:0;margin-right:0}
.strip .k{display:block;font-size:12px;color:var(--muted)}
.strip .v{font-size:20px;font-weight:500}
.slotbar{height:2px;background:var(--line);position:relative}
.slotbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0;transition:width 1s linear}
/* sections */
.card{border:1px solid var(--line);background:var(--bg)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-b{padding:16px}
.grid2{display:grid;grid-template-columns:1.7fr 1fr;gap:24px;margin-top:24px;align-items:start}
/* table */
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--dim);font-weight:500;text-align:right;padding:8px 16px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:16px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer;box-shadow:inset 2px 0 0 transparent;transition:box-shadow .12s,background .12s}
tr.row:hover{background:var(--bg2);box-shadow:inset 2px 0 0 var(--accent)}
.tk{font-family:var(--mono);font-weight:600;font-size:16px;letter-spacing:.02em}
.nm{color:var(--muted);font-size:12px}
.pr{font-size:20px;font-weight:500}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.chg{font-weight:500}
.spark{width:96px;height:24px;display:block;margin-left:auto}
/* buttons */
.btn{background:transparent;border:1px solid var(--line2);border-radius:2px;padding:8px 12px;font-weight:500;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#17120a;font-weight:600}
.btn.pri:hover{filter:brightness(1.06)}
.btn.danger{color:var(--up);border-color:#5a2a2d}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:4px 8px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line2)}
.seg button{background:none;border:0;border-right:1px solid var(--line2);padding:4px 12px;color:var(--muted);font:500 12px var(--mono);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--text);color:var(--bg)}
/* detail */
.back{display:inline-flex;gap:8px;color:var(--muted);margin-top:24px;font-size:12px}
.back:hover{color:var(--text)}
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:16px}
.dcode{font:600 20px var(--mono);letter-spacing:.02em}
.dprice{font-size:44px;font-weight:500;letter-spacing:-.03em;line-height:1.1;margin-top:8px}
.dprice small{font-size:16px;color:var(--muted);margin-left:8px;letter-spacing:0}
.chart{position:relative}
.chart svg{display:block;width:100%;height:300px}
.tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line2);padding:8px 12px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%);display:none;z-index:2}
.kv{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--line)}
.kv div{padding:12px 0;border-bottom:1px solid var(--line)}
.kv div:nth-child(odd){padding-right:16px}
.kv span{display:block;color:var(--muted);font-size:12px}
.kv b{font-weight:500;font-family:var(--mono)}
.trade{border-top:1px solid var(--line);padding-top:16px;margin-top:24px}
.trade h3{margin:0 0 4px;font-size:14px;font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input,select,textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:2px;padding:8px 12px;font-size:14px;min-width:0;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:1px solid var(--accent);border-color:var(--accent)}
textarea{resize:vertical;min-height:72px}
.row-f{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row-f .field{flex:1;min-width:112px}
.hist td{padding:8px 16px;font-size:12px}
.badge{font:500 12px var(--mono);color:var(--muted)}
.badge.admin{color:var(--accent)}
.badge.manual{color:var(--ok)}
.badge.err{color:var(--up)}
/* admin */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px;align-items:start}
.agrid .card-b{display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;font-size:14px;font-weight:500;z-index:50;display:none;max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(5,5,6,.78);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal .box{background:var(--bg);border:1px solid var(--line2);border-top:2px solid var(--accent);max-width:420px;width:100%;padding:24px}
.modal h3{margin:0 0 8px;font-size:16px}
.modal p{color:var(--muted);margin:0 0 24px;white-space:pre-line}
.empty{padding:48px 16px;color:var(--muted)}
.copybox{width:100%;font-family:var(--mono);font-size:12px;min-height:168px;margin-top:12px;line-height:1.6}
.foot{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);color:var(--dim);font-size:12px;line-height:1.8}
.nlist{display:flex;flex-direction:column}
.nitem{padding:12px 16px;border-bottom:1px solid var(--line)}
.nitem:last-child{border-bottom:0}
.nitem .t{font-weight:600}
.nitem .d{color:var(--muted);font-size:14px;white-space:pre-line;margin-top:4px}
.pin{font:600 12px var(--mono);color:var(--accent);margin-right:8px}
.scroll{max-height:420px;overflow:auto}
.news{display:flex;flex-direction:column}
.nw{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.nw:last-child{border-bottom:0}
.nw:hover{background:var(--bg2)}
.nw .meta{grid-column:1/-1;display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--muted)}
.nw .kd{font:600 12px var(--mono)}
.nw .hl{grid-column:1/-1;font-size:14px;line-height:1.5}
.nw .fx{margin-left:auto;font:500 12px var(--mono)}
.card-h{flex-wrap:wrap}
.seg button{white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line)}
.lg{display:flex;align-items:center;gap:8px;background:none;border:0;border-right:1px solid var(--line);padding:8px 16px;cursor:pointer;font-size:13px;color:var(--text)}
.lg i{width:12px;height:3px;display:inline-block}
.lg.off{opacity:.35}
.lg:hover{background:var(--bg2)}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
.mini{padding:12px 12px 4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.mini:hover{background:var(--bg2)}
.mini .mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 4px}
.mini .mh .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:860px){.minis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.minis{grid-template-columns:1fr}}
.hn{display:block;font-size:12px;color:var(--muted);white-space:normal;margin-top:2px;text-align:left}
@media (max-width:860px){
  .grid2,.agrid{grid-template-columns:1fr}
  .strip{grid-template-columns:repeat(3,1fr)}
  .strip>div{margin-right:0;padding:12px 16px 12px 0;border-right:0;border-bottom:1px solid var(--line)}
  .clock .kst{display:none}
  .hide-m{display:none}
  td,th{padding-left:12px;padding-right:12px}
  .dprice{font-size:36px}
  .logo small{display:none}
}
@media (max-width:520px){
  .bar .wrap{gap:12px}
  .wrap{padding:0 16px 48px}
  .tape .in{padding:8px 16px}
  .pr{font-size:16px}
  .chart svg{height:232px}
}
</style>
</head>
<body>
<div class="bar"><div class="wrap">
  <a class="logo" href="#"><b>COM</b><span>EXCHANGE</span><small>v0.2</small></a>
  <nav id="nav"><a href="#" data-r="home">시세</a><a href="#rules" data-r="rules">규칙</a><a href="#notices" data-r="notices">공지</a><a href="#admin" data-r="admin" id="navAdmin" style="display:none">관리</a></nav>
  <div class="spacer"></div>
  <div class="clock"><span class="kst num" id="kst"></span><span class="pill wait" id="mstatus"><span class="dot"></span><span>연결 중</span></span></div>
</div></div>
<div class="tape" id="tape"><div class="in sub">시세를 불러오는 중…</div></div>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status"></div>
<div class="modal" id="modal"><div class="box"><h3 id="mT"></h3><p id="mB"></p><label class="field" id="mInW" style="display:none;margin:-8px 0 20px"><span id="mInL"></span><input id="mIn" maxlength="32" autocomplete="nickname"></label><div class="row-f" style="justify-content:flex-end"><button class="btn" id="mNo">취소</button><button class="btn pri" id="mOk">확인</button></div></div></div>

<script>
window.COM_STATIC=true;window.ComEngine={MAX_VOL:20};
</script>
<script>
'use strict';
const E = window.ComEngine;
const S = { db:null, user:null, canEdit:false, isOwner:false, me:null, genesis:undefined, events:[], notices:[], err:null, sim:null, simErr:null, stale:false, range:'1D', route:{name:'home'}, busy:false, histCode:null, histDate:null };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => Math.round(n).toLocaleString('ko-KR');
const com = (n) => fmt(n) + ' COM';
const pct = (n) => (n > 0 ? '+' : '') + n.toFixed(2) + '%';
const dir = (n) => n > 0 ? 'up' : n < 0 ? 'down' : 'flat';
const arrow = (n) => n > 0 ? '▲' : n < 0 ? '▼' : '–';
const TZ = { timeZone:'Asia/Seoul' };
const tKST = (ms, o) => new Date(ms).toLocaleString('ko-KR', Object.assign({}, TZ, o || { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false }));
const dKST = (ms) => new Date(ms).toLocaleDateString('sv-SE', TZ); // YYYY-MM-DD
const hhmm = (m) => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const schedLabel = () => { if(!S.genesis) return ''; const sc=S.genesis.schedule; if(!sc) return S.genesis.periodMin+'분마다 갱신';
  const m=sc.slice().sort((a,b)=>a-b), st=m.length>2?m[1]-m[0]:0;
  if (m.length>3 && m.every((x,i)=>!i||x-m[i-1]===st)) return '장 '+hhmm(m[0])+'~'+hhmm(m[m.length-1])+' · '+st+'분마다 갱신';
  return '매일 '+m.map(hhmm).join(' · ')+' 갱신'; };
const kstMin = (ms) => Math.floor(((ms + 9*36e5) % 864e5) / 6e4);
function session(){ // real-market style status
  if (!S.sim) return null; if (S.sim.halted) return { k:'halt', label:'시장 중지' };
  if (S.genesis && S.genesis.start > Date.now()) return { k:'pre', label: tKST(S.genesis.start,{hour:'2-digit',minute:'2-digit',hour12:false})+' 개장 예정' };
  const sc=S.genesis&&S.genesis.schedule; if(!sc||sc.length<4) return { k:'open', label:'운영 중' };
  const m=sc.slice().sort((a,b)=>a-b), n=kstMin(Date.now());
  if (n < m[0]) return { k:'pre', label:'장 시작 전 · '+hhmm(m[0])+' 개장' };
  if (n > m[m.length-1]) return { k:'closed', label:'장 마감 · 내일 '+hhmm(m[0])+' 개장' };
  return { k:'open', label:'장중' };
}
const fmtD = (n,d) => Number(n).toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
function fmtCap(n){ if(!(n>0)) return '-'; if(n>=1e8) return fmtD(n/1e8, n>=1e10?0:1)+'억'; if(n>=1e4) return fmt(n/1e4)+'만'; return fmt(n); }
const kday = (ms) => Math.floor((ms + 9*36e5) / 864e5);
// COM 종합지수: market-cap weighted, base 1,000 at open; divisor adjusted on new listings so a listing does not move the index
function computeIndex(){
  const sim=S.sim; if(!sim) return null;
  const sh=(s)=>s.shares>0?s.shares:1, ev=[];
  sim.stocks.forEach((s)=>s.history.forEach((h)=>ev.push({t:h.t,s,p:h.p,k:h.k})));
  ev.sort((a,b)=>a.t-b.t); if(!ev.length) return null;
  const last=new Map(); let cap=0, div=0; const series=[];
  for (let i=0;i<ev.length;){ const t=ev[i].t;
    for (; i<ev.length && ev[i].t===t; i++){ const e=ev[i];
      if (!last.has(e.s.code)){ const before = div? cap/div : null; cap += e.p*sh(e.s); last.set(e.s.code,e.p); div = before===null ? cap/1000 : cap/before; }
      else { cap += (e.p-last.get(e.s.code))*sh(e.s); last.set(e.s.code,e.p); } }
    series.push({ t, p: cap/div });
  }
  const value=series[series.length-1].p, today=kday(Date.now());
  let prev=series[0].p; for (const x of series){ if (kday(x.t)<today) prev=x.p; }
  const totalCap = sim.stocks.reduce((a,s)=>a+s.price*(s.shares||0),0);
  return { code:'COM 종합지수', price:value, history:series, prevClose:prev, change:value-prev, changePct:prev?(value/prev-1)*100:0, totalCap };
}
function todayOHLC(s){ const today=kday(Date.now()); const pts=s.history.filter((h)=>kday(h.t)===today && h.k!=='list').map((h)=>h.p);
  if(!pts.length) return { o:s.prevClose, h:Math.max(s.prevClose,s.price), l:Math.min(s.prevClose,s.price), c:s.price };
  return { o:pts[0], h:Math.max(...pts), l:Math.min(...pts), c:s.price }; }
const KIND_LABEL = { setup:'예고', success:'성공', fail:'실패', single:'속보', admin:'특보' };
const newsTone = (n) => n.effect>0?'up':n.effect<0?'down':'flat';
function newsItems(list, max, showCode){
  if (!list.length) return '<div class="empty" style="padding:24px 16px">아직 뉴스가 없습니다. 정기 갱신 때 뉴스가 나올 수 있어요.</div>';
  return list.slice(0,max).map((n)=>`<div class="nw" data-go="${n.code}"><div class="meta"><span class="kd ${newsTone(n)}">${KIND_LABEL[n.kind]||'뉴스'}</span>${showCode?`<span class="tk" style="font-size:12px">${n.code}</span>`:''}<span class="num">${esc(tKST(n.t))}</span><span class="fx num ${dir(n.price-n.prev)}">${arrow(n.price-n.prev)} ${fmt(Math.abs(n.price-n.prev))}</span></div><div class="hl">${esc(n.headline)}</div></div>`).join('');
}
const TYPE_LABEL = { news:'뉴스 발행', halt:'시장 중지', resume:'시장 재개', tick:'수동 갱신', set_price:'가격 변경', set_vol:'변동폭 변경', update_info:'종목 정보 수정', list:'신규 상장' };

/* ---------- toast & modal ---------- */
let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display='none',2600); }
function ask(title, body, okText, opt){ opt=opt||{}; return new Promise((res)=>{ $('mT').textContent=title; $('mB').textContent=body; $('mOk').textContent=okText||'확인'; $('mNo').textContent=opt.noText||'취소';
  const inW=$('mInW'), inp=$('mIn'); inW.style.display=opt.input?'flex':'none'; if(opt.input){ $('mInL').textContent=opt.input.label; inp.value=opt.input.value||''; inp.placeholder=opt.input.placeholder||''; }
  $('modal').style.display='flex'; if(opt.input) setTimeout(()=>inp.focus(),30);
  const done=(v)=>{ if(v && opt.input){ const t=inp.value.trim(); if(!t){ inp.focus(); toast(opt.input.label+'을(를) 입력하세요.'); return; } v=t; }
    $('modal').style.display='none'; $('mOk').onclick=$('mNo').onclick=null; inp.onkeydown=null; res(v); };
  $('mOk').onclick=()=>done(true); $('mNo').onclick=()=>done(false); inp.onkeydown=(e)=>{ if(e.key==='Enter') done(true); }; }); }
async function copyText(text){ try{ await navigator.clipboard.writeText(text); toast('클립보드에 복사했습니다.'); return true; }catch(e){ toast('자동 복사가 막혔습니다. 아래 상자에서 직접 복사하세요.'); return false; } }

/* ---------- simulation ---------- */
function recompute(){
  if (window.COM_STATIC) return; // static site: prices come precomputed in data.json
  if (!S.genesis) { S.sim=null; return; }
  try { S.sim = E.simulate(S.genesis, S.events, Date.now()); S.simErr=null; }
  catch(e){ S.sim=null; S.simErr=e.message; }
}
function stock(code){ return S.sim && S.sim.stocks.find((s)=>s.code===code); }

/* ---------- routing ---------- */
function parseRoute(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return { name:'home' };
  if (h==='admin') return { name:'admin' };
  if (h==='notices') return { name:'notices' };
  if (h==='rules') return { name:'rules' };
  if (/^[A-Z0-9]{2,6}$/.test(h)) return { name:'stock', code:h };
  return { name:'home' };
}
window.addEventListener('hashchange', ()=>{ S.route=parseRoute(); render(); window.scrollTo(0,0); });

/* ---------- chart ---------- */
function rangeStart(r){ const now=Date.now(); return r==='1D'?now-864e5:r==='1W'?now-7*864e5:r==='1M'?now-30*864e5:-Infinity; }
function seriesFor(s, r){
  const from = rangeStart(r); const h = s.history;
  let i = h.findIndex((x)=>x.t>=from); if (i<0) i=h.length-1;
  const pts = h.slice(Math.max(0,i-1)); // include the point just before range for continuity
  if (pts.length && pts[0].t < from && isFinite(from)) pts[0] = { t:from, p:pts[0].p, k:'carry' };
  pts.push({ t:Date.now(), p:s.price, k:'now' });
  return pts;
}
function sparkSVG(s){
  const pts = seriesFor(s,'1D'); const ps = pts.map((x)=>x.p); const mn=Math.min(...ps), mx=Math.max(...ps), sp=Math.max(1,mx-mn);
  const t0=pts[0].t, t1=pts[pts.length-1].t, ts=Math.max(1,t1-t0);
  const d = pts.map((x,i)=>(i?'L':'M')+((x.t-t0)/ts*96).toFixed(1)+','+(26-(x.p-mn)/sp*24).toFixed(1)).join('');
  const c = s.change>0?'var(--up)':s.change<0?'var(--down)':'var(--flat)';
  return `<svg class="spark" viewBox="0 0 96 28" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${c}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}
function drawChart(s, boxId, dec, opt){
  boxId=boxId||'chart'; dec=dec||0; opt=opt||{}; const nf=(n)=>dec?fmtD(n,dec):fmt(n);
  const box = $(boxId); if (!box) return;
  if (boxId==='chart' && S.ctype==='candle' && S.range!=='1D') return drawCandles(s, box);
  const W = box.clientWidth || 600, H = opt.h || (box.clientWidth < 520 ? 230 : 300), pl=8, pr=opt.pr||62, pt=opt.h?10:16, pb=26;
  const pts = seriesFor(s, opt.range || S.range);
  const ps = pts.map((x)=>x.p); let mn=Math.min(...ps), mx=Math.max(...ps);
  const pad = Math.max(dec?0.01:1,(mx-mn)*0.12); mn=Math.max(0,mn-pad); mx=mx+pad;
  const t0=pts[0].t, t1=pts[pts.length-1].t, ts=Math.max(1,t1-t0);
  const X=(t)=>pl+(t-t0)/ts*(W-pl-pr), Y=(p)=>pt+(1-(p-mn)/(mx-mn))*(H-pt-pb);
  const first=pts[0].p, last=s.price, c = last>first?'var(--up)':last<first?'var(--down)':'var(--flat)';
  let line=''; pts.forEach((x,i)=>{ line += (i? 'L'+X(x.t).toFixed(1)+','+Y(pts[i-1].p).toFixed(1):'M'+X(x.t).toFixed(1)+','+Y(x.p).toFixed(1)); if(i) line+='L'+X(x.t).toFixed(1)+','+Y(x.p).toFixed(1); });
  const area = line + `L${X(t1).toFixed(1)},${H-pb}L${X(t0).toFixed(1)},${H-pb}Z`;
  let grid=''; for (let i=0;i<=4;i++){ const p=mn+(mx-mn)*i/4, y=Y(p); grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${W-pr+8}" y="${y+4}" fill="var(--dim)" font-size="11" font-family="IBM Plex Mono">${nf(p)}</text>`; }
  let xl=''; for (let i=0;i<=3;i++){ const t=t0+ts*i/3, x=X(t); const lab = ts < 2*864e5 ? tKST(t,{hour:'2-digit',minute:'2-digit',hour12:false}) : tKST(t,{month:'numeric',day:'numeric'}); xl+=`<text x="${x}" y="${H-7}" fill="var(--dim)" font-size="11" text-anchor="${i===0?'start':i===3?'end':'middle'}">${esc(lab)}</text>`; }
  const refY = Y(first);
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="height:${H}px" role="img" aria-label="${esc(s.code)} 가격 차트">
    <defs><linearGradient id="g${boxId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".12"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
    ${grid}${xl}<line x1="${pl}" x2="${W-pr}" y1="${refY}" y2="${refY}" stroke="var(--muted)" stroke-opacity=".35" stroke-dasharray="1 3"/>
    <path d="${area}" fill="url(#g${boxId})"/><path d="${line}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>
    <line id="cx${boxId}" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/><circle id="cdot${boxId}" r="4.5" fill="${c}" stroke="var(--bg)" stroke-width="2" visibility="hidden"/>
    <rect x="${pl}" y="0" width="${W-pl-pr}" height="${H}" fill="transparent" id="hit${boxId}"/></svg><div class="tip" id="tip${boxId}"></div>`;
  const svg = box.querySelector('svg'), hit=$('hit'+boxId), tip=$('tip'+boxId), cx=$('cx'+boxId), cd=$('cdot'+boxId);
  const real = pts.filter((x)=>x.k!=='carry');
  const move = (ev) => {
    const r = svg.getBoundingClientRect(); const mx = (ev.clientX - r.left) * (W / r.width);
    let best=real[0], bd=1e18; for (const x of real){ const d=Math.abs(X(x.t)-mx); if(d<bd){bd=d;best=x;} }
    const x=X(best.t), y=Y(best.p);
    cx.setAttribute('x1',x); cx.setAttribute('x2',x); cx.setAttribute('visibility','visible'); cd.setAttribute('cx',x); cd.setAttribute('cy',y); cd.setAttribute('visibility','visible');
    const kind = best.k==='admin'?' · 관리자 변경':best.k==='manual'?' · 수동 갱신':best.k==='now'?' · 현재':best.k==='news'?' · 뉴스':'';
    tip.innerHTML = `<b class="num">${dec?fmtD(best.p,dec):com(best.p)}</b><div class="sub">${esc(tKST(best.t))}${kind}</div>${best.n?`<div style="max-width:220px;white-space:normal;margin-top:4px">${esc(best.n)}</div>`:''}`;
    tip.style.display='block'; tip.style.left = Math.min(Math.max(x*(r.width/W),70), r.width-70)+'px'; tip.style.top = (y*(r.height/H)-10)+'px';
  };
  const leave = () => { tip.style.display='none'; cx.setAttribute('visibility','hidden'); cd.setAttribute('visibility','hidden'); };
  hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move); hit.addEventListener('pointerleave', leave);
}

const PALETTE=['#f0b23e','#3fc1c9','#b48cff','#ff7eb6','#8bd450','#5aa9ff','#d9d9d9','#ff9f43'];
const lineColor=(k)=>PALETTE[k%PALETTE.length];
function drawMulti(){
  const box=$('multichart'); if(!box||!S.sim) return;
  const W=box.clientWidth||600, H=box.clientWidth<520?260:340, pl=8, pr=56, pt=16, pb=26, rng=S.mrange||'1D';
  const lines=S.sim.stocks.map((st,k)=>{ const ser=seriesFor(st,rng), b=ser[0].p||1; return { st, k, b, pts:ser.map((x)=>({t:x.t,p:x.p,v:(x.p/b-1)*100})) }; });
  const vis=lines.filter((l)=>!(S.hidden||{})[l.st.code]); const use=vis.length?vis:lines;
  const t0=Math.min(...use.map((l)=>l.pts[0].t)), t1=Math.max(...use.map((l)=>l.pts[l.pts.length-1].t)), ts=Math.max(1,t1-t0);
  let mn=Math.min(0,...use.flatMap((l)=>l.pts.map((x)=>x.v))), mx=Math.max(0,...use.flatMap((l)=>l.pts.map((x)=>x.v)));
  const pad=Math.max(0.5,(mx-mn)*0.12); mn-=pad; mx+=pad;
  const X=(t)=>pl+(t-t0)/ts*(W-pl-pr), Y=(v)=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  let g=''; for(let i=0;i<=4;i++){ const v=mn+(mx-mn)*i/4, y=Y(v); g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${W-pr+8}" y="${y+4}" fill="var(--dim)" font-size="11" font-family="IBM Plex Mono">${(v>0?'+':'')+v.toFixed(1)}%</text>`; }
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-opacity=".5"/>`;
  for(let i=0;i<=3;i++){ const t=t0+ts*i/3; const lab=ts<2*864e5?tKST(t,{hour:'2-digit',minute:'2-digit',hour12:false}):tKST(t,{month:'numeric',day:'numeric'}); g+=`<text x="${X(t)}" y="${H-7}" fill="var(--dim)" font-size="11" text-anchor="${i===0?'start':i===3?'end':'middle'}">${esc(lab)}</text>`; }
  const paths=use.map((l)=>{ let d=''; l.pts.forEach((x,i)=>{ d+= i? `L${X(x.t).toFixed(1)},${Y(l.pts[i-1].v).toFixed(1)}L${X(x.t).toFixed(1)},${Y(x.v).toFixed(1)}` : `M${X(x.t).toFixed(1)},${Y(x.v).toFixed(1)}`; });
    const last=l.pts[l.pts.length-1]; return `<path d="${d}" fill="none" stroke="${lineColor(l.k)}" stroke-width="2" stroke-linejoin="round"/><circle cx="${X(last.t)}" cy="${Y(last.v)}" r="3" fill="${lineColor(l.k)}"/>`; }).join('');
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="height:${H}px;display:block;width:100%" role="img" aria-label="전체 회사 주가 비교">${g}${paths}<line id="mx" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/><rect x="${pl}" y="0" width="${W-pl-pr}" height="${H}" fill="transparent" id="mhit"/></svg><div class="tip" id="mtip"></div>`;
  const svg=box.querySelector('svg'), tip=$('mtip'), vx=$('mx');
  const at=(l,t)=>{ let r=l.pts[0]; for(const x of l.pts){ if(x.t<=t) r=x; else break; } return r; };
  const mv=(ev)=>{ const r=svg.getBoundingClientRect(); const t=t0+Math.min(1,Math.max(0,((ev.clientX-r.left)*(W/r.width)-pl)/(W-pl-pr)))*ts; const x=X(t);
    vx.setAttribute('x1',x); vx.setAttribute('x2',x); vx.setAttribute('visibility','visible');
    const rows=use.map((l)=>({l,pt:at(l,t)})).sort((a,b)=>b.pt.v-a.pt.v).map(({l,pt})=>`<div style="display:flex;gap:8px;align-items:center"><i style="width:10px;height:3px;background:${lineColor(l.k)};display:inline-block"></i><b style="min-width:34px">${l.st.code}</b><span class="num" style="min-width:52px;text-align:right">${fmt(pt.p)}</span><span class="num ${dir(pt.v)}">${(pt.v>0?'+':'')+pt.v.toFixed(2)}%</span></div>`).join('');
    tip.innerHTML=`<div class="sub" style="margin-bottom:4px">${esc(tKST(t))}</div>${rows}`; tip.style.display='block';
    const left=x*(r.width/W); tip.style.left=Math.min(Math.max(left,90),r.width-90)+'px'; tip.style.top='120px'; };
  $('mhit').addEventListener('pointermove',mv); $('mhit').addEventListener('pointerdown',mv); $('mhit').addEventListener('pointerleave',()=>{ tip.style.display='none'; vx.setAttribute('visibility','hidden'); });
}
function drawMinis(){ S.sim.stocks.forEach((s)=>{ if($('mc-'+s.code)) drawChart(s,'mc-'+s.code,0,{h:130,range:S.mrange||'1D',pr:46}); }); }
function drawCandles(s, box){
  const W = box.clientWidth || 600, H = box.clientWidth < 520 ? 230 : 300, pl=8, pr=62, pt=16, pb=26;
  const from=rangeStart(S.range), days=new Map();
  let prevC=null;
  s.history.forEach((h)=>{ const d=kday(h.t); if(!days.has(d)) days.set(d,{d,o:prevC!==null&&h.k!=='list'?prevC:h.p,h:h.p,l:h.p,c:h.p,t:h.t}); const x=days.get(d); if(prevC!==null&&x.o===prevC){ x.h=Math.max(x.h,prevC); x.l=Math.min(x.l,prevC);} x.h=Math.max(x.h,h.p); x.l=Math.min(x.l,h.p); x.c=h.p; prevC=h.p; });
  const cs=[...days.values()].filter((x)=>x.t>=from || (x.d*864e5-9*36e5)>=from);
  if(!cs.length){ box.innerHTML='<div class="empty">표시할 일봉이 없습니다.</div>'; return; }
  let mn=Math.min(...cs.map((x)=>x.l)), mx=Math.max(...cs.map((x)=>x.h)); const pad=Math.max(1,(mx-mn)*0.12); mn=Math.max(0,mn-pad); mx+=pad;
  const n=cs.length, cw=(W-pl-pr)/Math.max(n,8), bw=Math.max(3,Math.min(18,cw*0.6));
  const X=(i)=>pl+cw*(i+0.5), Y=(p)=>pt+(1-(p-mn)/(mx-mn))*(H-pt-pb);
  let g=''; for(let i=0;i<=4;i++){ const p=mn+(mx-mn)*i/4, y=Y(p); g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${W-pr+8}" y="${y+4}" fill="var(--dim)" font-size="11" font-family="IBM Plex Mono">${fmt(p)}</text>`; }
  const step=Math.max(1,Math.ceil(n/6)); cs.forEach((x,i)=>{ if(i%step===0) g+=`<text x="${X(i)}" y="${H-7}" fill="var(--dim)" font-size="11" text-anchor="middle">${esc(tKST(x.t,{month:'numeric',day:'numeric'}))}</text>`; });
  const bars=cs.map((x,i)=>{ const c=x.c>x.o?'var(--up)':x.c<x.o?'var(--down)':'var(--flat)', yo=Y(x.o), yc=Y(x.c), top=Math.min(yo,yc), hgt=Math.max(1.5,Math.abs(yc-yo));
    return `<g data-i="${i}"><line x1="${X(i)}" x2="${X(i)}" y1="${Y(x.h)}" y2="${Y(x.l)}" stroke="${c}" stroke-width="1.2"/><rect x="${X(i)-bw/2}" y="${top}" width="${bw}" height="${hgt}" fill="${c}"/></g>`; }).join('');
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="height:${H}px" role="img" aria-label="${esc(s.code)} 일봉 차트">${g}${bars}<rect x="${pl}" y="0" width="${W-pl-pr}" height="${H}" fill="transparent" id="chit"/></svg><div class="tip" id="ctip"></div>`;
  const svg=box.querySelector('svg'), tip=$('ctip');
  const mv=(ev)=>{ const r=svg.getBoundingClientRect(); const i=Math.min(n-1,Math.max(0,Math.floor(((ev.clientX-r.left)*(W/r.width)-pl)/cw))); const x=cs[i];
    tip.innerHTML=`<b>${esc(tKST(x.t,{month:'numeric',day:'numeric'}))}</b><div class="num sub">시 ${fmt(x.o)} · 고 ${fmt(x.h)}<br>저 ${fmt(x.l)} · 종 ${fmt(x.c)}</div>`;
    tip.style.display='block'; tip.style.left=Math.min(Math.max(X(i)*(r.width/W),70),r.width-70)+'px'; tip.style.top=(Y(x.h)*(r.height/H)-10)+'px'; };
  $('chit').addEventListener('pointermove',mv); $('chit').addEventListener('pointerdown',mv); $('chit').addEventListener('pointerleave',()=>tip.style.display='none');
}

/* ---------- discord text ---------- */
function discordText(){
  const sim=S.sim; if(!sim) return '';
  const lines = sim.stocks.map((s)=>`${s.code.padEnd(5)} ${fmt(s.price).padStart(7)} COM  ${arrow(s.change)} ${pct(s.changePct)}`);
  const fresh = sim.news.filter((n)=>n.t>=sim.slotStart).slice().reverse().map((n)=>`> [${KIND_LABEL[n.kind]||'뉴스'}] ${n.headline} (${n.code} ${arrow(n.price-n.prev)})`);
  const ix=computeIndex(), ses=session();
  return ['**COM EXCHANGE 시세** · '+tKST(sim.slotStart)+' KST'+(ses?' · '+ses.label:''), ...(ix?['COM 종합지수 **'+fmtD(ix.price,2)+'** '+arrow(ix.change)+' '+pct(ix.changePct)]:[]), ...(fresh.length?['', '**뉴스**', ...fresh, '']:[]), '```', ...lines, '```',
    sim.halted ? '현재 시장 운영이 중지되어 있습니다.' : '다음 갱신 '+tKST(sim.nextUpdate,{hour:'2-digit',minute:'2-digit',hour12:false}),
    '-# 가상 시장입니다. 매수·매도·입출금은 디스코드에서 사되에게 신청하세요. (자동 체결·자동 송금 없음)'].join('\n');
}

/* ---------- views ---------- */
function setStatus(){
  const el=$('mstatus');
  if (S.err || S.simErr) { el.className='pill halt'; el.innerHTML='<span class="dot"></span><span>연결 오류</span>'; return; }
  if (!S.sim) { el.className='pill wait'; el.innerHTML='<span class="dot"></span><span>연결 중</span>'; return; }
  const ses=session(); el.className='pill'+(ses.k==='halt'?' halt':ses.k==='open'?'':' wait'); el.innerHTML='<span class="dot"></span><span>'+esc(ses.label)+'</span>';
}
function renderTape(){
  const t=$('tape'); if(!S.sim){ t.innerHTML='<div class="in sub">'+(S.err?esc(S.err):'시세를 불러오는 중…')+'</div>'; return; }
  t.innerHTML='<div class="in">'+S.sim.stocks.map((s)=>`<a href="#${s.code}"><b>${s.code}</b><span class="num">${fmt(s.price)}</span> <span class="num ${dir(s.change)}">${arrow(s.change)} ${pct(s.changePct)}</span></a>`).join('')+'</div>';
}
function noticeBar(){
  const pinned = S.notices.filter((n)=>n.pinned).slice(0,2);
  return pinned.map((n)=>`<div class="notice"><span class="lab">공지</span><div><b>${esc(n.title)}</b>${n.body?' <span class="sub" style="font-size:14px">'+esc(n.body)+'</span>':''}</div></div>`).join('');
}
function stateBlock(){
  if (S.err) return `<div class="card" style="margin-top:22px"><div class="empty"><b>시세 서버에 연결할 수 없습니다.</b><br><span class="sub">${esc(S.err)}</span></div></div>`;
  if (S.simErr) return `<div class="card" style="margin-top:22px"><div class="empty"><b>시세 데이터가 올바르지 않습니다.</b><br><span class="sub">${esc(S.simErr)}</span></div></div>`;
  if (S.genesis === undefined) return `<div class="card" style="margin-top:22px"><div class="empty">시세를 불러오는 중…${S.stale?'<br><span class="sub">연결이 늦어지고 있습니다. 잠시 후 다시 확인해 주세요.</span>':''}</div></div>`;
  if (S.genesis === null) return `<div class="card" style="margin-top:22px"><div class="empty"><b>아직 시장이 개설되지 않았습니다.</b><br><span class="sub">사되가 초기 설정을 완료하면 시세가 표시됩니다.</span>${S.isOwner?'<div style="margin-top:14px"><button class="btn pri" id="setup">기본 5종목으로 시장 개설</button></div>':''}</div></div>`;

function evDesc(e){ const p=e.payload||{};
  switch(e.type){ case 'news': return `${p.code} ${p.effect>0?'+':''}${p.effect}% · ${p.headline||''}`; case 'set_price': return `${p.code} → ${com(p.price||0)}`; case 'set_vol': return `${p.code} 변동폭 ±${p.vol}%`; case 'list': return `${p.code} ${p.name||''} · ${com(p.initial||0)} · ±${p.vol}%`;
    case 'update_info': return `${p.code} ${['name','sector','description'].filter((k)=>p[k]!==undefined).map((k)=>({name:'기업명',sector:'섹터',description:'설명'}[k])).join('·')} 수정`; default: return ''; } }

/* ---------- trade requests ---------- */
const REQ_MAX = 10;
const validReq = (r) => r && typeof r.id==='string' && /^[a-z0-9]{4,16}$/.test(r.id) && (r.side==='매수'||r.side==='매도') && typeof r.code==='string' && /^[A-Z0-9]{2,6}$/.test(r.code)
  && Number.isInteger(r.qty) && r.qty>=1 && r.qty<=1e6 && typeof r.price==='number' && isFinite(r.price) && typeof r.nick==='string' && r.nick.length<=32 && typeof r.at==='number';
const reqLine = (r) => `[${r.side} 신청] ${r.code} ${fmt(r.qty)}주 · 신청 시세 ${com(r.price)} · 디스코드 ${r.nick} · 신청번호 #${r.id} · ${tKST(r.at)} KST`;
function pendingList(){ const out=[]; (S.reqs||[]).forEach((d)=>{ const it=d.data&&Array.isArray(d.data.items)?d.data.items:[]; it.forEach((r)=>{ if(validReq(r)) out.push(Object.assign({uid:d.uid},r)); }); }); return out.sort((a,b)=>a.at-b.at); }
function doneList(){ const out=[]; (S.reqs||[]).forEach((d)=>{ const it=d.data&&Array.isArray(d.data.done)?d.data.done:[]; it.forEach((r)=>{ if(validReq(r)) out.push(Object.assign({uid:d.uid},r)); }); }); return out.sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).slice(0,15); }
function myReqHTML(){
  const m=S.myReq; if(!m) return '';
  const items=(Array.isArray(m.items)?m.items:[]).filter(validReq), done=(Array.isArray(m.done)?m.done:[]).filter(validReq).slice(0,5);
  if(!items.length && !done.length) return '';
  const row=(r,st)=>`<tr><td class="num sub">${esc(tKST(r.at))}</td><td>${r.side} ${esc(r.code)} ${fmt(r.qty)}주</td><td>${st}</td></tr>`;
  return `<div style="margin-top:16px"><div class="sub">내 신청</div><table class="hist"><tbody>${items.slice().reverse().map((r)=>row(r,'<span class="badge admin">대기</span>')).join('')}${done.map((r)=>row(r,r.result==='rejected'?'<span class="badge err">거절</span>':'<span class="badge manual">완료</span>')).join('')}</tbody></table></div>`;
}
function pendingHTML(){
  const list=pendingList(), done=doneList();
  return `<section class="card" style="margin-top:16px"><div class="card-h"><h2>대기 중인 거래 신청</h2><span class="sub">${list.length}건</span></div>
    ${list.length?`<div class="scroll" style="overflow-x:auto"><table class="hist"><thead><tr><th>신청 시각</th><th>디스코드</th><th>신청</th><th>신청가</th><th>금액</th><th></th></tr></thead><tbody>
    ${list.map((r)=>`<tr><td class="num sub">${esc(tKST(r.at))}<span class="hn">#${esc(r.id)}</span></td><td style="text-align:left">${esc(r.nick)}</td><td><span class="${r.side==='매수'?'up':'down'}">${r.side}</span> ${esc(r.code)} ${fmt(r.qty)}주</td><td class="num">${fmt(r.price)}</td><td class="num">${fmt(r.price*r.qty)}</td>
      <td><div class="row-f" style="justify-content:flex-end;flex-wrap:nowrap"><button class="btn sm pri" data-rq="${esc(r.id)}" data-uid="${esc(r.uid)}" data-how="done">성공</button><button class="btn sm danger" data-rq="${esc(r.id)}" data-uid="${esc(r.uid)}" data-how="rejected">거절</button></div></td></tr>`).join('')}
    </tbody></table></div>`:'<div class="empty" style="padding:24px 16px">대기 중인 신청이 없습니다.</div>'}
    ${done.length?`<div class="card-b" style="border-top:1px solid var(--line)"><div class="sub" style="margin-bottom:8px">최근 처리</div><table class="hist"><tbody>${done.map((r)=>`<tr><td class="num sub">${esc(tKST(r.doneAt||r.at))}</td><td style="text-align:left">${esc(r.nick)}</td><td>${r.side} ${esc(r.code)} ${fmt(r.qty)}주 · ${fmt(r.price)}</td><td>${r.result==='rejected'?'<span class="badge err">거절</span>':'<span class="badge manual">완료</span>'}</td></tr>`).join('')}</tbody></table></div>`:''}</section>`;
}
async function requestTrade(s, side, qty){
  const verb = side==='매수'?'살':'팔'; let nick=''; try{ nick=localStorage.getItem('com-nick')||''; }catch(e){}
  const ans = await ask(`진짜 ${verb}거임?`, `${s.code} ${s.name}\n${side} ${fmt(qty)}주 · 지금 시세 ${com(s.price)}\n예상 금액 ${com(s.price*qty)}\n\n${window.COM_STATIC?"'예'를 누르면 디스코드에 붙여넣을 신청 문구가 복사됩니다.":"'예'를 누르면 사되의 대기 명단에 올라가고 디스코드에 붙여넣을 문구가 복사됩니다."}`, '예', { noText:'아니요', input:{ label:'디스코드 닉네임', value:nick, placeholder:'예: sadoe' } });
  if (!ans) return;
  nick = ans.slice(0,32); try{ localStorage.setItem('com-nick',nick); }catch(e){}
  const a=new Uint32Array(2); crypto.getRandomValues(a);
  const r = { id:(a[0].toString(36)+a[1].toString(36)).slice(0,8), side, code:s.code, qty, price:s.price, nick, at:Date.now() };
  const text = reqLine(r);
  copyText(text); // inside the 예 click
  let recorded=false;
  if (S.db && S.me){
    const cur = S.myReq||{}; const items=(Array.isArray(cur.items)?cur.items:[]).filter(validReq);
    if (items.length>=REQ_MAX) toast('대기 중인 신청이 '+REQ_MAX+'건이라 더 기록할 수 없어요. 사되가 처리할 때까지 기다려 주세요.');
    else { try{ await S.db.doc('requests/'+S.me).set({ nick, items:[...items, r], done:(Array.isArray(cur.done)?cur.done:[]).slice(0,20) }); recorded=true; }catch(e){} }
  }
  S.lastReq = { code:s.code, text, recorded };
  render(); toast(window.COM_STATIC?'문구를 복사했어요! 디스코드에 붙여넣으면 신청 완료.':recorded?'신청 완료! 복사된 문구를 디스코드에 붙여넣으세요.':'대기 명단 기록은 실패했어요. 복사된 문구를 디스코드에 꼭 붙여넣으세요.');
}
async function resolveReq(uid, id, how){
  const d=(S.reqs||[]).find((x)=>x.uid===uid); if(!d) return;
  const items=Array.isArray(d.data.items)?d.data.items:[]; const r=items.find((x)=>x&&x.id===id); if(!r||!validReq(r)) return;
  const ok = how==='done';
  if(!await ask(ok?'지급 완료 처리':'신청 거절', `${r.nick} · ${r.side} ${r.code} ${fmt(r.qty)}주 · 신청가 ${com(r.price)}\n\n${ok?'COM과 주식을 주고받은 뒤 누르세요. 거래 장부에도 적는 것 잊지 마세요!':'거절하면 대기 명단에서 빠집니다.'}`, ok?'성공':'거절')) return;
  const rest=items.filter((x)=>!(x&&x.id===id)), done=[Object.assign({},r,{result:ok?'done':'rejected',doneAt:Date.now()}), ...(Array.isArray(d.data.done)?d.data.done:[])].slice(0,20);
  guard(()=>S.db.doc('requests/'+uid).update({ items:rest, done }), ok?'처리 완료! 대기 명단에서 뺐습니다.':'거절했습니다.');
}
function render(){
  S.route = S.route || parseRoute();
  document.querySelectorAll('#nav a').forEach((a)=>a.classList.toggle('on', a.dataset.r===(S.route.name==='stock'?'home':S.route.name)));
  $('navAdmin').style.display = S.canEdit ? '' : 'none';
  const pc = pendingList().length; $('navAdmin').textContent = '관리' + (pc ? ' ('+pc+')' : '');
  const keep = snapshotInputs();
  const app=$('app'); const r=S.route;
  app.innerHTML = (r.name==='stock'?viewStock(r.code):r.name==='admin'?viewAdmin():r.name==='notices'?viewNotices():r.name==='rules'?viewRules():viewHome())
    + `<div class="foot">COM EXCHANGE v0.2 · 커뮤니티용 가상 증권거래소 · 모든 종목은 실제 기업이 아닌 가상 종목입니다.<br>가격은 종목별 설정 범위의 균등 난수와 시장 뉴스로 ${schedLabel()||'정해진 시각에 갱신'}되는 공통 규칙에 따라 계산되며, 실제 화폐·투자 상품과 무관합니다. 시각은 한국 표준시(KST) 기준입니다.</div>`;
  setStatus(); renderTape(); bind();
  if (r.name==='stock' && stock(r.code)) drawChart(stock(r.code));
  if (r.name==='home' && $('multichart')) drawMulti();
  if (keep) restoreInputs(keep);
}
const INPUTS=['wCode','wEff','wHead','aReason','pCode','pPrice','pReason','eCode','eName','eSector','eVol','eDesc','lCode','lName','lSector','lInit','lVol','lDesc','nTitle','nBody','nPin','tSide','tQty'];
function snapshotInputs(){ const o={}; INPUTS.forEach((id)=>{ const el=$(id); if(el) o[id]= el.type==='checkbox'?el.checked:el.value; }); o._focus=document.activeElement&&document.activeElement.id; return o; }
function restoreInputs(o){ Object.keys(o).forEach((id)=>{ const el=$(id); if(el && id!=='_focus'){ if(el.type==='checkbox') el.checked=o[id]; else el.value=o[id]; } }); if(o._focus&&$(o._focus)) $(o._focus).focus(); }

/* ---------- interactions ---------- */
function bind(){
  document.querySelectorAll('[data-go]').forEach((el)=>el.onclick=()=>{ location.hash=el.dataset.go; });
  const cd=$('copyD'); if(cd) cd.onclick=()=>copyText(discordText());
  const setup=$('setup'); if(setup) setup.onclick=setupMarket;
  document.querySelectorAll('#rseg button').forEach((b)=>b.onclick=()=>{ S.range=b.dataset.r; if(S.ctype==='candle'&&S.range==='1D') S.range='1M'; render(); });
  document.querySelectorAll('#mseg button').forEach((b)=>b.onclick=()=>{ S.mrange=b.dataset.m; render(); });
  document.querySelectorAll('[data-lg]').forEach((b)=>b.onclick=()=>{ S.hidden=S.hidden||{}; S.hidden[b.dataset.lg]=!S.hidden[b.dataset.lg]; render(); });
  document.querySelectorAll('#cseg button').forEach((b)=>b.onclick=()=>{ S.ctype=b.dataset.c; if(S.ctype==='candle'&&S.range==='1D') S.range='1M'; render(); });
  const tq=$('tQty'), ts=$('tSide'), tp=$('tPrev'), tc=$('tCopy');
  if (tc){ const s=stock(S.route.code); const upd=()=>{ const q=Math.max(1,Math.floor(+tq.value||1)); tp.textContent=`예상 금액 ${com(q*s.price)} (현재가 기준, 참고용)`; };
    tq.oninput=upd; ts.onchange=upd; upd();
    tc.onclick=()=>requestTrade(s, ts.value, Math.max(1,Math.floor(+tq.value||1))); }
  document.querySelectorAll('[data-rq]').forEach((b)=>b.onclick=()=>resolveReq(b.dataset.uid, b.dataset.rq, b.dataset.how));
  if (S.route.name==='admin' && S.canEdit && S.sim) bindAdmin();
}
function fillEdit(){ const s=stock($('eCode').value); if(!s) return; $('eName').value=s.name; $('eSector').value=s.sector; $('eVol').value=s.vol; $('eDesc').value=s.description; }
function bindAdmin(){
  const ec=$('eCode'); if(ec){ ec.onchange=fillEdit; if(!$('eName').value) fillEdit(); }
  const hc=$('hCode'); if(hc){ hc.value=S.histCode||S.sim.stocks[0].code; hc.onchange=()=>{S.histCode=hc.value; render();}; $('hDate').onchange=(e)=>{S.histDate=e.target.value; render();}; }
  $('hCopy').onclick=()=>{ const s=stock($('hCode').value); const d=$('hDate').value; copyText('time_kst,price,kind,rate_pct\n'+s.history.filter((x)=>dKST(x.t)===d).map((x)=>`${tKST(x.t,{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})},${x.p},${x.k},${x.r??''}`).join('\n')); };
  document.querySelectorAll('[data-act]').forEach((b)=>b.onclick=()=>adminAct(b.dataset.act, b));
  document.querySelectorAll('[data-del]').forEach((b)=>b.onclick=async()=>{ if(!await ask('공지 삭제','이 공지를 삭제할까요? 되돌릴 수 없습니다.','삭제')) return; guard(()=>S.db.doc('notices/'+b.dataset.del).delete(),'공지를 삭제했습니다.'); });
  document.querySelectorAll('[data-pin]').forEach((b)=>b.onclick=()=>{ const n=S.notices.find((x)=>x.id===b.dataset.pin); guard(()=>S.db.doc('notices/'+n.id).update({pinned:!n.pinned}),'공지를 수정했습니다.'); });
}
async function guard(fn, okMsg){
  if (S.busy) return; S.busy=true; document.querySelectorAll('[data-act]').forEach((b)=>b.disabled=true);
  try { await fn(); toast(okMsg); return true; }
  catch(e){ toast(e && e.code==='invalid_argument' ? '권한이 없거나 입력이 올바르지 않습니다.' : '저장하지 못했습니다: '+(e&&e.message||e)); return false; }
  finally { S.busy=false; render(); }
}
async function writeEvent(type, payload, reason){
  const maxAt = S.events.reduce((m,e)=>Math.max(m,e.at||0),0);
  const at = Math.max(Date.now(), maxAt+1); // append-only, never back-dated
  await S.db.collection('events').add({ v:1, at, type, payload:payload||{}, reason:(reason||'').slice(0,200), actor:S.me||null });
}
async function adminAct(act){
  const v=(id)=>($(id).value||'').trim();
  if (act==='halt'||act==='resume'){ if(!await ask(TYPE_LABEL[act], act==='halt'?'자동 시세 갱신을 멈춥니다.':'다음 구간부터 자동 갱신을 재개합니다.', TYPE_LABEL[act])) return;
    if (await guard(()=>writeEvent(act,{},v('aReason')), TYPE_LABEL[act]+' 처리했습니다.')) $('aReason') && ($('aReason').value=''); return; }
  if (act==='tick'){
    const dup = S.events.some((e)=>e.type==='tick' && e.at>=S.sim.slotStart && e.at<S.sim.nextUpdate);
    if (dup) return toast('지난 정기 갱신 이후 이미 수동 갱신이 있었습니다.');
    if(!await ask('수동 갱신','모든 종목에 1회 무작위 변동을 즉시 적용합니다. 정기 갱신 사이에는 1회만 적용됩니다.','갱신')) return;
    return guard(()=>writeEvent('tick',{},v('aReason')),'수동 갱신을 적용했습니다.'); }
  if (act==='set_price'){ const code=v('pCode'), price=Number(v('pPrice')), reason=v('pReason'); const s=stock(code);
    if(!Number.isInteger(price)||price<1) return toast('가격은 1 이상의 정수여야 합니다.'); if(!reason) return toast('사유를 입력하세요.');
    if(!await ask('가격 직접 변경', `${code}: ${com(s.price)} → ${com(price)}\n사유: ${reason}\n\n감사 기록에 남으며 되돌리려면 다시 변경해야 합니다.`,'변경')) return;
    if (await guard(()=>writeEvent('set_price',{code,price},reason),'가격을 변경했습니다.')){ $('pPrice').value=''; $('pReason').value=''; } return; }
  if (act==='set_vol'||act==='update_info'){ const code=v('eCode'); const vol=Number(v('eVol'));
    if(!(vol>=0&&vol<=E.MAX_VOL)) return toast('변동폭은 0~'+E.MAX_VOL+'% 사이여야 합니다.');
    if (act==='set_vol') return guard(()=>writeEvent('set_vol',{code,vol}),'변동폭을 저장했습니다. 다음 구간부터 적용됩니다.');
    const s=stock(code), p={code}; if(v('eName')!==s.name) p.name=v('eName'); if(v('eSector')!==s.sector) p.sector=v('eSector'); if($('eDesc').value!==s.description) p.description=$('eDesc').value;
    if(p.name!==undefined && !p.name) return toast('기업명을 입력하세요.');
    const ch = Object.keys(p).length>1; const vch = vol!==s.vol;
    if(!ch && !vch) return toast('변경된 내용이 없습니다.');
    return guard(async()=>{ if(ch) await writeEvent('update_info',p); if(vch) await writeEvent('set_vol',{code,vol}); },'종목 정보를 저장했습니다.'); }
  if (act==='list'){ const code=v('lCode').toUpperCase(), name=v('lName'), initial=Number(v('lInit')), vol=Number(v('lVol'));
    if(!/^[A-Z0-9]{2,6}$/.test(code)) return toast('코드는 영문 대문자·숫자 2~6자입니다.'); if(stock(code)) return toast('이미 있는 코드입니다.');
    if(!name) return toast('기업명을 입력하세요.'); if(!Number.isInteger(initial)||initial<1) return toast('상장가는 1 이상의 정수입니다.'); if(!(vol>=0&&vol<=E.MAX_VOL)) return toast('변동폭을 확인하세요.');
    if(!await ask('신규 상장',`${code} ${name}\n상장가 ${com(initial)} · 변동폭 ±${vol}%\n\n상장은 되돌릴 수 없습니다.`,'상장')) return;
    if (await guard(()=>writeEvent('list',{code,name,sector:v('lSector'),description:$('lDesc').value.slice(0,1000),initial,vol}),code+' 상장을 등록했습니다.')) ['lCode','lName','lSector','lInit','lVol','lDesc'].forEach((id)=>$(id)&&($(id).value='')); return; }
  if (act==='news'){ const code=v('wCode'), headline=v('wHead'), effect=Number(v('wEff'));
    if(!headline) return toast('뉴스 제목을 입력하세요.'); if(v('wEff')===''||!(effect>=-20&&effect<=20)) return toast('효과는 -20 ~ +20% 사이로 입력하세요.');
    if(!await ask('뉴스 발행',`${code} · ${headline}\n효과 ${effect>0?'+':''}${effect}% (즉시 반영)\n\n발행하면 되돌릴 수 없습니다.`,'발행')) return;
    if (await guard(()=>writeEvent('news',{code,headline,effect}),'뉴스를 발행했습니다.')) ['wHead','wEff'].forEach((id)=>$(id)&&($(id).value='')); return; }
  if (act==='notice'){ const title=v('nTitle'); if(!title) return toast('제목을 입력하세요.');
    if (await guard(()=>S.db.collection('notices').add({title,body:$('nBody').value.slice(0,1000),pinned:$('nPin').checked,at:Date.now(),actor:S.me||null}),'공지를 등록했습니다.')) ['nTitle','nBody'].forEach((id)=>$(id)&&($(id).value='')); }
}
async function setupMarket(){
  if(!await ask('시장 개설','기본 5종목(CCI·MUG·SAI·DER·RIM)으로 시장을 개설합니다. 매일 08:00 · 17:00 · 22:00에 갱신됩니다.','개설')) return;
  const a=new Uint32Array(4); crypto.getRandomValues(a);
  const now=Date.now(), dayStart = Math.floor((now+9*36e5)/864e5)*864e5-9*36e5;
  guard(()=>S.db.doc('market/genesis').set({ v:1, seed:Array.from(a,(x)=>x.toString(16)).join(''), start:dayStart, schedule:[480,1020,1320], dailyLimitPct:15, createdAt:now, stocks:DEFAULT_STOCKS }),'시장을 개설했습니다.');
}
const DEFAULT_STOCKS=[
  {code:'CCI',name:'크리티컬 컴퓨터 Inc.',sector:'컴퓨터',initial:500,vol:2,description:'가상의 컴퓨터 하드웨어 기업. 고성능 연산 장비와 서버를 만든다.'},
  {code:'MUG',name:'무당 세계관 그룹',sector:'콘텐츠',initial:800,vol:1.5,description:'가상의 콘텐츠 그룹. 여러 세계관 IP를 만들고 운영한다.'},
  {code:'SAI',name:'사되 AI',sector:'인공지능',initial:1200,vol:3,description:'가상의 인공지능 기업. AI 모델과 서비스를 개발한다.'},
  {code:'DER',name:'다크 에너지 원자로',sector:'에너지',initial:350,vol:2.5,description:'가상의 에너지 기업. 실험적인 차세대 원자로를 연구·운영한다.'},
  {code:'RIM',name:'리버수 얼음 광산',sector:'광업',initial:1000,vol:1.8,description:'가상의 광업 기업. 얼음 광산에서 자원을 채굴한다.'}];

/* ---------- data wiring ---------- */
function onData(){ recompute(); render(); }
let lastLoad=0;
// live prices from the Cloudflare Worker (exact to the minute); GitHub's data.json is the backup
const API_URL='https://com-exchange.sigeupcalc.workers.dev/api/data';
async function fetchData(){
  try{ const c=new AbortController(), tm=setTimeout(()=>c.abort(),8000);
    const r=await fetch(API_URL+'?t='+Date.now(),{cache:'no-store',signal:c.signal}); clearTimeout(tm);
    if(r.ok){ const d=await r.json(); if(d&&d.sim){ S.source='live'; return d; } } }catch(e){}
  const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error(r.status);
  S.source='backup'; return r.json();
}
async function loadStatic(){
  lastLoad=Date.now();
  try{ const d=await fetchData(); S.genesis=d.genesis; S.notices=Array.isArray(d.notices)?d.notices:[]; S.sim=d.sim; S.events=[]; S.err=null; S.simErr=null; S.dataAt=d.generatedAt; render(); }
  catch(e){ if(!S.sim){ S.err='시세 데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.'; render(); } }
}
async function init(){
  S.route=parseRoute(); render();
  if (window.COM_STATIC){ loadStatic(); setInterval(loadStatic, 60000); return; }
  const stallT = setTimeout(()=>{ if(S.genesis===undefined){ S.stale=true; render(); } }, 10000);
  let db=null, user=null;
  try { [db,user] = await Promise.all([window.claude?claude.use('db'):null, window.claude?claude.use('user'):null]); } catch(e){}
  S.user=user;
  if (!db){ clearTimeout(stallT); S.err='공통 시세 저장소를 사용할 수 없습니다. claude.ai에 로그인한 상태에서, 공유받은 링크로 열어 주세요.'; render(); return; }
  S.db=db;
  try { S.isOwner = !!(user && await user.isOwner()); S.canEdit = !!(user && await user.canEdit()); S.me = user ? await user.id() : null; } catch(e){}
  if (S.me) db.doc('requests/'+S.me).onSnapshot((snap)=>{ S.myReq = snap.exists ? snap.data() : null; render(); }, ()=>{});
  if (S.canEdit) db.collection('requests').onSnapshot((snap)=>{ S.reqs = snap.docs.map((d)=>({ uid:d.id, data:d.data() })); render(); }, ()=>{});
  db.doc('market/genesis').onSnapshot((snap)=>{ if(!snap.metadata.fromCache) clearTimeout(stallT);
      if(!snap.exists){ if(!snap.metadata.fromCache) S.genesis=null; }
      else S.genesis = snap.data(); onData(); },
    (e)=>{ clearTimeout(stallT); S.err='시세 데이터를 읽지 못했습니다 ('+e.code+').'; render(); });
  db.collection('events').orderBy('at').onSnapshot((snap)=>{ S.events = snap.docs.map((d)=>Object.assign({id:d.id}, d.data())); onData(); },
    (e)=>{ S.err='변경 기록을 읽지 못했습니다 ('+e.code+').'; render(); });
  db.collection('notices').orderBy('at','desc').limit(50).onSnapshot((snap)=>{ S.notices = snap.docs.map((d)=>Object.assign({id:d.id}, d.data())).filter((n)=>typeof n.title==='string'); render(); }, ()=>{});
}
// clock + slot rollover (no writes: every viewer derives the same new prices locally)
setInterval(()=>{
  $('kst').textContent = tKST(Date.now(),{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})+' KST';
  if (window.COM_STATIC){ if (S.sim && Date.now() >= S.sim.nextUpdate+3000 && Date.now()-lastLoad > 10000) loadStatic(); if (S.sim && $('cd') && !S.sim.halted) $('cd').textContent = S.sim.nextUpdate>Date.now()?fmtLeft(S.sim.nextUpdate-Date.now()):'반영 중'; }
  else if (S.sim && Date.now() >= S.sim.nextUpdate){ recompute(); if(!(S.route.name==='admin' && document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) render(); else renderTape(); toast('새 시세가 반영되었습니다.'); }
  else if (S.sim && $('cd') && !S.sim.halted){ $('cd').textContent = fmtLeft(S.sim.nextUpdate-Date.now()); const f=$('slotfill'); if(f) f.style.width=((Date.now()-S.sim.slotStart)/(S.sim.nextUpdate-S.sim.slotStart)*100).toFixed(2)+'%'; }
}, 1000);
let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(S.route.name==='stock'&&stock(S.route.code)) drawChart(stock(S.route.code)); if(S.route.name==='home'&&$('multichart')) drawMulti(); },150); });
init();
</script>
